[project]
name = "guardian"
version = "0.1.0"
description = "AI incident-response agent for the home (Ring track, Amazon Developer Hackathon)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.9.1",
    "bcrypt>=5.0.0",
    "boto3>=1.43.118",
    "cryptography>=50.0.2",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.1",
    "python-ulid>=4.0.1",
    "ring-sandbox[server]>=0.5.0",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.5.0",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
